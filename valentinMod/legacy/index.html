<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Yellow Flowers Day 🌻</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sky">
        <div class="sun"></div>
    </div>

    <div class="garden" id="garden">
        <div class="flower flower-1" style="left: 10%; bottom: 0;">
            <div class="petal petal-a"></div>
            <div class="petal petal-b"></div>
            <div class="petal petal-c"></div>
            <div class="petal petal-d"></div>
            <div class="petal petal-e"></div>
            <div class="petal petal-f"></div>
            <div class="center"></div>
            <div class="stem"></div>
            <div class="leaf"></div>
        </div>
        <div class="flower flower-2" style="left: 30%; bottom: 0;">
            <div class="petal petal-a"></div>
            <div class="petal petal-b"></div>
            <div class="petal petal-c"></div>
            <div class="petal petal-d"></div>
            <div class="petal petal-e"></div>
            <div class="petal petal-f"></div>
            <div class="center"></div>
            <div class="stem"></div>
            <div class="leaf"></div>
        </div>
        <div class="flower flower-3" style="left: 55%; bottom: 0;">
            <div class="petal petal-a"></div>
            <div class="petal petal-b"></div>
            <div class="petal petal-c"></div>
            <div class="petal petal-d"></div>
            <div class="petal petal-e"></div>
            <div class="petal petal-f"></div>
            <div class="center"></div>
            <div class="stem"></div>
            <div class="leaf"></div>
        </div>
        <div class="flower flower-4" style="left: 75%; bottom: 0;">
            <div class="petal petal-a"></div>
            <div class="petal petal-b"></div>
            <div class="petal petal-c"></div>
            <div class="petal petal-d"></div>
            <div class="petal petal-e"></div>
            <div class="petal petal-f"></div>
            <div class="center"></div>
            <div class="stem"></div>
            <div class="leaf"></div>
        </div>
        <div class="flower flower-5" style="left: 90%; bottom: 0;">
            <div class="petal petal-a"></div>
            <div class="petal petal-b"></div>
            <div class="petal petal-c"></div>
            <div class="petal petal-d"></div>
            <div class="petal petal-e"></div>
            <div class="petal petal-f"></div>
            <div class="center"></div>
            <div class="stem"></div>
            <div class="leaf"></div>
        </div>
    </div>

    <div class="particles" id="particles"></div>

    <main class="content">
        <div class="badge">
            <span class="badge-icon">🌻</span>
            <span class="badge-text">21 de Septiembre</span>
        </div>

        <h1 class="title">
            Happy<br><span class="highlight">Yellow</span> Flowers Day
        </h1>

        <p class="subtitle">
            Un día para celebrar la alegría, el sol y las flores que iluminan el mundo
        </p>

        <div class="card">
            <div class="card-flower">🌼</div>
            <p class="card-text">
                Hoy celebramos todas las flores amarillas que nos regalan su luz y su belleza
            </p>
        </div>

        <div class="btn-container">
            <button id="plant-btn" class="el-btn">
                <span class="btn-icon">🌱</span> Plantar una flor
            </button>
            <button id="celebrate-btn" class="el-btn">
                <span class="btn-icon">✨</span> Celebrar
            </button>
        </div>

        <div class="mascot">
            <img src="../public/assets/images/togepi-happy.gif" alt="Togepi feliz" id="togepi-gif"/>
        </div>

        <p class="date">Septiembre 21</p>
    </main>

    <div class="footer">
        <p>Hecho con 💛 y pétalos de sol</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
