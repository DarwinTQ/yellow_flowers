<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Día de las Flores Amarillas! 🌻</title>
    <link rel="stylesheet" href="styles.css">
    <script src="other.js"></script>
</head>
<body>
    <div class="sky">
        <div class="sun"></div>
    </div>

    <div class="garden">
        <div class="flower flower-1" style="left: 10%; bottom: 0;">
            <div class="petal petal-a"></div><div class="petal petal-b"></div>
            <div class="petal petal-c"></div><div class="petal petal-d"></div>
            <div class="petal petal-e"></div><div class="petal petal-f"></div>
            <div class="center"></div><div class="stem"></div><div class="leaf"></div>
        </div>
        <div class="flower flower-2" style="left: 55%; bottom: 0;">
            <div class="petal petal-a"></div><div class="petal petal-b"></div>
            <div class="petal petal-c"></div><div class="petal petal-d"></div>
            <div class="petal petal-e"></div><div class="petal petal-f"></div>
            <div class="center"></div><div class="stem"></div><div class="leaf"></div>
        </div>
    </div>

    <div class="particles" id="particles"></div>

    <main class="content">
        <div class="badge">
            <span class="badge-icon">🌻</span>
            <span class="badge-text">21 de Septiembre</span>
        </div>

        <div class="mascot">
            <img src="../public/assets/images/togepi-and-pikachu.gif" alt="Togepi feliz" id="togepi-gif"/>
        </div>

        <h1 class="title">
            ¡Gracias por <span class="highlight">celebrar</span>! 🌼
        </h1>

        <p class="subtitle">
            Hoy celebramos juntos el Día de las Flores Amarillas. Que tu día esté lleno de sol y alegría
        </p>

        <div class="card">
            <div class="card-flower">💛</div>
            <p class="card-text">
                ¡Has hecho el mejor elección! Las flores amarillas brillan porque tú las valoras
            </p>
        </div>

        <div class="btn-container">
            <button class="el-btn secondary" onclick="window.location.href='index.html'">
                <span class="btn-icon">🌻</span> Volver al inicio
            </button>
        </div>

        <button class="joker-float" tabindex="-1">🌸 ¡Encuéntrame! 🥰</button>

        <p class="date">21 de Septiembre</p>
    </main>

    <div class="footer">
        <p>Hecho con 💛 y pétalos de sol</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
